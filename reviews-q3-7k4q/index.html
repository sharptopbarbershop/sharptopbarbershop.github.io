<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><title>Sharp Top Manager Reviews</title><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>Sharp Top Manager Reviews</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=Archivo+Narrow:wght@500;600;700&display=swap">
<style>
:root{
  color-scheme:dark;
  --bg:#09090a;--bg2:#111113;--glass:rgba(255,255,255,.045);--glass2:rgba(255,255,255,.07);--line:rgba(255,255,255,.09);--line2:rgba(255,255,255,.16);
  --fg:#f4f2ee;--fg2:#b9b5ad;--fg3:#7d7972;--brass:#d4b06a;--brass2:#a8894c;
  --green:#3ecf8e;--green-bg:rgba(62,207,142,.13);--yellow:#f2c94c;--yellow-bg:rgba(242,201,76,.13);--red:#f0706a;--red-bg:rgba(240,112,106,.13);--blue:#6ea8ff;--blue-bg:rgba(110,168,255,.13);
  --ros:#d4b06a;--we:#6ea8ff;
  --r:16px;--font:'Archivo',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;--narrow:'Archivo Narrow','Archivo',ui-sans-serif,system-ui,sans-serif;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.45;font-variant-numeric:tabular-nums;min-height:100vh}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(900px 600px at 85% -10%,rgba(212,176,106,.13),transparent 60%),radial-gradient(800px 600px at -10% 30%,rgba(110,168,255,.08),transparent 60%),radial-gradient(700px 500px at 50% 110%,rgba(62,207,142,.05),transparent 60%),var(--bg)}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3{margin:0;text-wrap:balance;font-weight:700;letter-spacing:-.01em}
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
/* sidebar */
.side{position:sticky;top:0;height:100vh;overflow-y:auto;border-right:1px solid var(--line);background:rgba(8,8,9,.82);backdrop-filter:blur(18px);padding:20px 14px 28px;padding-left:max(14px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:18px}
.brand{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:4px 8px 10px;border-bottom:1px solid var(--line)}
.brand b{font-family:var(--narrow);font-size:24px;letter-spacing:.14em;font-weight:700;line-height:1}
.brand span{font-size:10px;letter-spacing:.42em;color:var(--brass);font-weight:600}
.brand small{margin-top:8px;font-size:11px;color:var(--fg3);letter-spacing:.02em}
.nav{display:flex;flex-direction:column;gap:2px}
.nav h4{margin:12px 8px 6px;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--fg3);font-weight:600}
.nav a{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:10px;color:var(--fg2);text-decoration:none;font-size:13.5px;border:1px solid transparent}
.nav a:hover{background:var(--glass);color:var(--fg)}
.nav a.on{background:var(--glass2);border-color:var(--line);color:var(--fg)}
.nav a .mini{width:24px;height:24px;font-size:10px}
.nav a.off{opacity:.55}
.nav a .tag{margin-left:auto;font-size:10px;color:var(--fg3)}
/* main */
.main{min-width:0;padding-block:18px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1320px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
#view{display:flex;flex-direction:column;gap:18px;min-width:0}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:14px;background:rgba(14,14,16,.78);backdrop-filter:blur(16px)}
.bar .grow{flex:1 1 auto}
.seg{display:inline-flex;padding:3px;border-radius:10px;background:rgba(255,255,255,.05);border:1px solid var(--line);gap:2px}
.seg button{border:0;background:transparent;padding:5px 11px;border-radius:7px;color:var(--fg2);font-size:12.5px;font-weight:600;white-space:nowrap}
.seg button.on{background:var(--fg);color:#111}
.seg button:disabled{opacity:.35;cursor:not-allowed}
.lbl{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--fg3);font-weight:600;margin-right:2px}
.fg{display:inline-flex;align-items:center;gap:6px}
select.sel{background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:13px}
select.sel option{background:#151517}
.mnav{display:none}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line2);background:rgba(255,255,255,.06);padding:8px 13px;border-radius:10px;font-weight:600;font-size:13px;white-space:nowrap}
.btn:hover{background:rgba(255,255,255,.1)}
.btn.pri{background:var(--brass);color:#16130c;border-color:transparent}
.btn.pri:hover{background:#e0c07f}
.btn.sm{padding:6px 10px;font-size:12px}
.btn:disabled{opacity:.5;cursor:wait}
.card{background:var(--glass);border:1px solid var(--line);border-radius:var(--r);padding:18px;backdrop-filter:blur(14px);min-width:0}
.card h3{font-size:15px;font-weight:700}
.card .sub{color:var(--fg3);font-size:12px;margin-top:2px}
.chead{display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:14px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g32{grid-template-columns:minmax(0,3fr) minmax(0,2fr)}
/* tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{background:rgba(255,255,255,.035);border:1px solid var(--line);border-radius:14px;padding:13px 14px;min-width:0}
.tile .k{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--fg3);font-weight:600;display:flex;gap:6px;align-items:center}
.tile .v{font-size:23px;font-weight:700;margin-top:5px;letter-spacing:-.02em;white-space:nowrap}
.tile .d{font-size:12px;margin-top:3px;color:var(--fg3);display:flex;flex-wrap:wrap;gap:4px 8px}
.up{color:var(--green)}.dn{color:var(--red)}.flat{color:var(--fg3)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;letter-spacing:.02em;white-space:nowrap}
.pill.g{background:var(--green-bg);color:var(--green)}.pill.y{background:var(--yellow-bg);color:var(--yellow)}.pill.r{background:var(--red-bg);color:var(--red)}.pill.b{background:var(--blue-bg);color:var(--blue)}.pill.n{background:rgba(255,255,255,.08);color:var(--fg2)}
.est{font-size:9.5px;font-weight:700;letter-spacing:.08em;padding:1px 6px;border-radius:5px;background:rgba(242,201,76,.14);color:var(--yellow)}
.act{font-size:9.5px;font-weight:700;letter-spacing:.08em;padding:1px 6px;border-radius:5px;background:var(--green-bg);color:var(--green)}
.own{font-size:9.5px;font-weight:700;letter-spacing:.08em;padding:1px 6px;border-radius:5px;background:rgba(212,176,106,.16);color:var(--brass)}
/* avatar */
.av{width:76px;height:76px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:26px;color:#111;flex:none;background-size:cover;background-position:center;border:2px solid rgba(255,255,255,.18);letter-spacing:.02em}
.mini{width:30px;height:30px;font-size:11px;border-width:1px}
/* hero */
.hero{display:flex;flex-wrap:wrap;gap:18px;align-items:center;justify-content:space-between}
.who{display:flex;gap:16px;align-items:center;min-width:0}
.who h1{font-size:28px;display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.who .meta{color:var(--fg2);margin-top:4px;font-size:13.5px}
.who .meta2{color:var(--fg3);margin-top:3px;font-size:12px}
.acts{display:flex;flex-wrap:wrap;gap:8px}
/* tabs */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs button{border:0;background:transparent;padding:10px 14px;color:var(--fg3);font-weight:600;font-size:13.5px;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button.on{color:var(--fg);border-color:var(--brass)}
/* tables */
.tw{overflow-x:auto;border-radius:12px;border:1px solid var(--line)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:9px 12px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
th{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--fg3);font-weight:600;background:rgba(255,255,255,.03);position:sticky;top:0}
th:first-child,td:first-child{text-align:left}
td.l,th.l{text-align:left}
tr:last-child td{border-bottom:0}
tbody tr:hover td{background:rgba(255,255,255,.025)}
tr.click{cursor:pointer}
tr.tot td{font-weight:700;background:rgba(255,255,255,.04)}
th.sort{cursor:pointer}
th.sort.on{color:var(--brass)}
.bname{display:flex;align-items:center;gap:10px;font-weight:600}
.dim{color:var(--fg3)}
.small{font-size:12px}
.note{font-size:12px;color:var(--fg3);line-height:1.55}
.note b{color:var(--fg2);font-weight:600}
.chartbox{position:relative;height:300px}
.chartbox.s{height:230px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:transparent;color:var(--fg2);padding:5px 11px;border-radius:999px;font-size:12px;font-weight:600}
.chip.on{background:rgba(212,176,106,.16);border-color:rgba(212,176,106,.5);color:var(--brass)}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--fg2);margin-top:10px}
.legend i{display:inline-block;width:18px;height:0;border-top:2px dashed currentColor;vertical-align:middle;margin-right:6px}
.legend i.s{border-top-style:solid;border-top-width:3px}
/* barber grid */
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.bcard{text-align:left;border:1px solid var(--line);background:rgba(255,255,255,.035);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:12px;transition:border-color .15s,background .15s}
.bcard:hover{border-color:var(--line2);background:rgba(255,255,255,.06)}
.bcard .top{display:flex;gap:10px;align-items:center}
.bcard .top .av{width:44px;height:44px;font-size:15px}
.bcard .nm{font-weight:700;font-size:14.5px}
.bcard .ps{font-size:12px;color:var(--fg3)}
.bcard .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.bcard .stats div{font-size:11px;color:var(--fg3)}
.bcard .stats b{display:block;font-size:14px;color:var(--fg);font-weight:700}
.bcard.off{opacity:.6}
/* progress */
.meter{height:7px;border-radius:9px;background:rgba(255,255,255,.08);overflow:hidden;min-width:80px}
.meter i{display:block;height:100%;border-radius:9px}
.list{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.list li{padding:12px 14px;border-radius:12px;background:rgba(255,255,255,.035);border:1px solid var(--line)}
.list li b{display:block;margin-bottom:3px}
.list li span{color:var(--fg2);font-size:13px}
.flag{border:1px solid rgba(242,201,76,.35);background:rgba(242,201,76,.07);color:#f5dd94;padding:10px 12px;border-radius:12px;font-size:12.5px}
.vs{display:grid;grid-template-columns:minmax(0,1.3fr) repeat(2,minmax(0,1fr));gap:0;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.vs>div{padding:10px 12px;border-bottom:1px solid var(--line)}
.vs .h{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--fg3);font-weight:600;background:rgba(255,255,255,.03)}
.vs .n{text-align:right;font-weight:600}
.vs .lead{color:var(--green)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#1c1c1f;border:1px solid var(--line2);padding:10px 16px;border-radius:12px;z-index:50;font-size:13px;max-width:calc(100vw - 32px)}
.empty{padding:40px;text-align:center;color:var(--fg3)}
.sec-title{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.sec-title h2{font-size:22px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px}
.kv dt{color:var(--fg3)}.kv dd{margin:0;text-align:right;font-weight:600}
@media (max-width:1100px){.g3{grid-template-columns:repeat(2,minmax(0,1fr))}.g32{grid-template-columns:minmax(0,1fr)}}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{display:none}
  .mnav{display:flex;align-items:center;gap:10px;width:100%}
  .mnav select{flex:1;min-width:0}
  .mnav .brand-m{font-family:var(--narrow);font-weight:700;letter-spacing:.12em;font-size:15px;white-space:nowrap}
}
@media (max-width:720px){
  .g2,.g3{grid-template-columns:minmax(0,1fr)}
  .who h1{font-size:22px}
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .tile .v{font-size:19px}
  .chartbox{height:250px}
  .vs{grid-template-columns:minmax(0,1.2fr) repeat(2,minmax(0,1fr))}
  .bar{position:static}
}

/* ---------- review page ---------- */
.av.xl{width:104px;height:104px;font-size:36px;border-width:3px;box-shadow:0 10px 40px rgba(212,176,106,.18)}
.rv-head{padding:26px;background:linear-gradient(135deg,rgba(212,176,106,.12),rgba(255,255,255,.03) 45%,rgba(110,168,255,.05));border-color:rgba(212,176,106,.22)}
.rv-top{display:flex;flex-wrap:wrap;gap:18px;justify-content:space-between;align-items:flex-start}
.rv-head h1{font-size:38px;letter-spacing:-.02em;line-height:1.05;margin:4px 0 8px}
.eyebrow{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--brass);font-weight:700}
.rv-head .meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;color:var(--fg2);font-size:14px}
.rv-ctrl{display:flex;flex-direction:column;gap:10px;align-items:flex-end}
.rv-switch,.rv-btns{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.rv-switch select{max-width:240px}
.btn.ghost{background:transparent}
.summary{font-size:18px;line-height:1.55;color:var(--fg2);margin:22px 0 20px;max-width:900px;text-wrap:pretty}
.summary b{color:var(--fg);font-weight:700}
.hk{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
.hk-i{background:rgba(0,0,0,.28);border:1px solid var(--line);border-radius:14px;padding:14px 16px;min-width:0}
.hk-i .k{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--fg3);font-weight:600}
.hk-i .v{font-size:30px;font-weight:800;letter-spacing:-.02em;margin:6px 0 6px;white-space:nowrap}
.hk-i .d{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px}
.chg{display:inline-flex;align-items:center;gap:4px;font-weight:700;font-size:12px;padding:2px 8px;border-radius:999px;white-space:nowrap}
.chg.up{background:var(--green-bg);color:var(--green)}.chg.dn{background:var(--red-bg);color:var(--red)}.chg.flat{background:rgba(255,255,255,.07);color:var(--fg3)}
.chg.big{font-size:13.5px;padding:4px 10px}
.stepnav{position:sticky;top:calc(env(safe-area-inset-top,0px) + 74px);z-index:15;display:flex;gap:6px;padding:6px;border:1px solid var(--line);border-radius:14px;background:rgba(14,14,16,.85);backdrop-filter:blur(16px);overflow-x:auto;scrollbar-width:none}
.stepnav button{flex:1 0 auto;display:flex;align-items:center;gap:8px;border:0;background:transparent;color:var(--fg3);padding:8px 12px;border-radius:10px;font-weight:600;font-size:13px;white-space:nowrap}
.stepnav button b{display:grid;place-items:center;width:22px;height:22px;border-radius:50%;background:rgba(255,255,255,.08);font-size:11.5px;color:var(--fg2)}
.stepnav button.on{background:rgba(212,176,106,.14);color:var(--fg)}
.stepnav button.on b{background:var(--brass);color:#16130c}
.step{display:flex;flex-direction:column;gap:14px;scroll-margin-top:140px;padding-top:10px}
.step-h{display:flex;align-items:center;gap:16px;margin-top:8px}
.step-h .num{font-family:var(--narrow);font-size:44px;font-weight:700;color:var(--brass);line-height:1;opacity:.9}
.step-h h2{font-size:28px;letter-spacing:-.02em}
.step-h .sub{color:var(--fg3);font-size:13px;margin-top:2px}
.card.inner{background:rgba(255,255,255,.035)}
.cmp{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.cmp-r{display:grid;grid-template-columns:minmax(120px,.9fr) minmax(0,1.6fr);grid-template-areas:"l b" "v b";gap:6px 16px;align-items:center;background:var(--glass);border:1px solid var(--line);border-radius:14px;padding:16px}
.cmp-l{grid-area:l}.cmp-bars{grid-area:b;display:flex;flex-direction:column;gap:8px;min-width:0}.cmp-v{grid-area:v}
.cmp-l .k{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--fg3);font-weight:600}
.cmp-l .v{font-size:28px;font-weight:800;letter-spacing:-.02em;margin-top:2px}
.bar-row{display:grid;grid-template-columns:86px minmax(0,1fr) 72px;gap:8px;align-items:center;font-size:12px;color:var(--fg3)}
.bar-row span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-row b{text-align:right;font-weight:600;color:var(--fg)}
.track{height:10px;border-radius:9px;background:rgba(255,255,255,.06);overflow:hidden}.track i{display:block;height:100%;border-radius:9px}
.verdict{display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center;padding:14px 18px;border:1px solid var(--line);border-radius:14px;background:var(--glass)}
.verdict div{font-size:14px;color:var(--fg2)}.verdict div b{font-size:26px;font-weight:800;margin-right:6px}
table.prog td{font-size:14.5px;padding:12px}table.prog td.cur,table.prog th.cur{color:var(--fg);font-weight:700;background:rgba(212,176,106,.07)}
.chartbox.lg{height:340px}
.ret-grid{display:grid;grid-template-columns:1.25fr repeat(2,minmax(0,1fr));gap:12px}
.ret-i{background:var(--glass);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:4px;min-width:0}
.ret-i.hero{grid-row:span 2;background:linear-gradient(160deg,rgba(212,176,106,.16),rgba(255,255,255,.03));border-color:rgba(212,176,106,.3);justify-content:center}
.ret-i .k{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--fg3);font-weight:700}
.ret-i .v{font-size:38px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.ret-i.hero .v{font-size:76px;color:var(--brass)}
.ret-i .s{color:var(--fg2);font-size:13px}
.ret-i .d{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;margin-top:4px}
.ret-i p{margin:8px 0 0;color:var(--fg2);font-size:14px;line-height:1.5}
.ret-i.hero p{font-size:16px}
.sw h3{display:flex;align-items:center;gap:10px;font-size:17px;margin-bottom:14px}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block}.dot.g{background:var(--green)}.dot.r{background:var(--red)}
.ins{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.ins li{padding:14px 16px;border-radius:12px;background:rgba(0,0,0,.22);border:1px solid var(--line);border-left:3px solid var(--green);display:flex;flex-direction:column;gap:5px;font-size:13.5px;color:var(--fg2)}
.ins li.o{border-left-color:var(--red)}
.ins .ih{display:flex;justify-content:space-between;gap:10px;align-items:baseline}.ins .ih b{color:var(--fg);font-size:15px}.ins .iv{font-size:20px;font-weight:800;color:var(--fg)}
.ins em{font-style:normal;color:var(--fg);background:rgba(255,255,255,.04);border-radius:8px;padding:8px 10px;margin-top:4px}
.mom{font-size:12px;font-weight:700}.mom.up{color:var(--green)}.mom.dn{color:var(--red)}
.goals{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}

<script>
"use strict";
const MGR=true; // manager edition: no owner financials, notes kept on the device
const D=JSON.parse(document.getElementById('data').textContent);
// Roster updates confirmed by the owner (Nov 5, 2026). History stays in all totals.
const FORMER={melspradlin:true};D.barbers.forEach(b=>{if(FORMER[b.id])b.stat='Former'});
const I={};D.qf.forEach((k,i)=>I[k]=i);const J={};D.lf.forEach((k,i)=>J[k]=i);
const QS=['Q1','Q2','Q3'];const QL={Q1:'Q1 (Jan–Mar)',Q2:'Q2 (Apr–Jun)',Q3:'Q3 (Jul–Sep)'};
const LOCS=['Rosedale','West Edge'];
const B=D.barbers.filter(b=>b.pos!=='Owner');
const BY={};B.forEach(b=>BY[b.id]=b);
const RANKED=B.filter(b=>b.rk).length;
const LC={Rosedale:'#d4b06a','West Edge':'#6ea8ff'};
const S={review:false,rstep:1,reviews:{},drafts:{},showFormer:false,hrs:{},rm:'rev',rgran:'q',present:false,curStep:1,fs:false,view:'overview',q:'Q3',loc:'All',mode:'owner',tab:'perf',gran:'weekly',tm:'svc',exm:'rev',sort:'rank',sortDir:1,canOwner:true,photos:{},assets:null,db:null,showOff:true};
try{const v=localStorage.getItem('st_prefs');if(v){const p=JSON.parse(v);['q','loc','rm','exm'].forEach(k=>{if(p[k])S[k]=p[k]})}}catch(e){}
function savePrefs(){try{localStorage.setItem('st_prefs',JSON.stringify({q:S.q,loc:S.loc,rm:S.rm,exm:S.exm}))}catch(e){}}

/* ---------- formatting ---------- */
const $0=v=>v==null||isNaN(v)?'—':'$'+Math.round(v).toLocaleString('en-US');
const $2=v=>v==null||isNaN(v)?'—':'$'+v.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const n0=v=>v==null||isNaN(v)?'—':Math.round(v).toLocaleString('en-US');
const n1=v=>v==null||isNaN(v)?'—':(Math.round(v*10)/10).toLocaleString('en-US',{minimumFractionDigits:1,maximumFractionDigits:1});
const pc=(v,d=1)=>v==null||isNaN(v)?'—':(v*100).toFixed(d)+'%';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const div=(a,b)=>b?a/b:null;
function chg(cur,prev,kind){ // kind: 'pct' (relative %), 'pts' (rate diff), lowerBetter flag via kind 'ptsInv'
  if(cur==null||prev==null||isNaN(cur)||isNaN(prev))return{t:'—',c:'flat',v:null};
  if(kind==='pts'||kind==='ptsInv'){const d=(cur-prev)*100;const good=kind==='ptsInv'?d<0:d>0;if(Math.abs(d)<0.05)return{t:'0.0 pts',c:'flat',v:0};return{t:(d>=0?'+':'')+d.toFixed(1)+' pts',c:Math.abs(d)<0.05?'flat':good?'up':'dn',v:d}}
  if(!prev)return{t:'new',c:'flat',v:null};
  const d=(cur-prev)/Math.abs(prev)*100;if(Math.abs(d)<0.05)return{t:'0.0%',c:'flat',v:0};const good=kind==='pctInv'?d<0:d>0;return{t:(d>=0?'+':'')+d.toFixed(1)+'%',c:Math.abs(d)<0.05?'flat':good?'up':'dn',v:d};
}
const NARROW=()=>innerWidth<720;
const prevQ=q=>QS[QS.indexOf(q)-1]||null;

/* ---------- weeks (Sat–Fri payroll weeks, same as Connect) ---------- */
const W0=new Date(2025,11,27);
function wkStart(i){const d=new Date(W0);d.setDate(d.getDate()+7*i);return d}
function wkQ(i){const d=wkStart(i);if(d.getFullYear()<2026)return 'Q1';return 'Q'+(Math.floor(d.getMonth()/3)+1)}
const md=d=>(d.getMonth()+1)+'/'+d.getDate();
function wkLabel(i){const s=wkStart(i),e=new Date(s);e.setDate(e.getDate()+6);return md(s)+'–'+md(e)}
function wkNote(i){if(i===0)return 'partial: data from 1/1';if(i===39)return 'partial: through 9/30';const s=wkStart(i),e=new Date(s);e.setDate(e.getDate()+6);if(wkQ(i)!=='Q'+(Math.floor(e.getMonth()/3)+1))return 'spans two quarters';return ''}
const WK=w=>({i:w[0],svc:w[1],tip:w[2],n:w[3],days:w[4],eh:w[5],bh:w[6],ah:w[7]});

/* ---------- metrics ---------- */
function bm(b,q){
  const r=b.q[q];if(!r)return null;const g=k=>r[I[k]];
  const weeks=b.w.map(WK).filter(w=>wkQ(w.i)===q&&w.n>0);
  const rev=g('service_revenue'),prod=g('product_sales'),appts=g('completed'),estH=g('est_hours'),actH=r[37];
  const bookedH=g('booked_min')/60;
  return{rev,prod,tips:g('sq_tips'),appts,estH,actH,bookedH,days:g('days_worked'),wk:weeks.length,avgWk:div(rev,weeks.length),
    ticket:div(rev+prod,appts),ticketPkg:div(g('csv_service_rev')+prod,appts),svcTicket:div(rev,appts),rph:div(rev,estH),rphAct:actH?rev/actH:null,util:div(bookedH,estH),
    ret:div(g('ret_any'),g('ret_eligible')),retElig:g('ret_eligible'),retAny:g('ret_any'),retSame:div(g('ret_same'),g('ret_eligible')),
    rebook:div(g('rebooked_visits'),appts),loyal:div(g('next_same'),g('next_visits')),nextN:g('next_visits'),nextSame:g('next_same'),nextOtherB:g('next_other_barber_same_loc'),nextOtherL:g('next_other_loc'),
    uniq:g('unique_customers'),newShop:g('new_to_shop'),newBarber:g('new_to_barber'),returning:g('returning_to_barber'),multi:g('multi_visit_customers'),
    ns:div(g('no_shows'),appts+g('no_shows')+g('cancelled')),nsN:g('no_shows'),cancel:div(g('cancelled_adj'),appts+g('no_shows')+g('cancelled')),cancelN:g('cancelled'),late:g('late_cancels'),
    comm:g('est_commission'),shopRet:g('est_shop_retained'),nsVal:g('noshow_value'),lateVal:g('late_cancel_value'),refunds:g('sq_refunds'),discounts:g('sq_discounts'),
    ppv:div(prod,appts),tipPct:div(g('sq_tips'),rev),mix:r[35],trans:r[36],flags:r[38]||'',rpd:div(rev,g('days_worked'))};
}
function lm(loc,q){
  const r=D.locs[loc==='All'?'Both shops':loc][q];const g=k=>r[J[k]];
  const rev=g('service_revenue'),appts=g('completed'),prod=g('product_sales');
  return{rev,prod,tips:g('sq_tips'),appts,estH:g('est_hours'),rph:div(rev,g('est_hours')),util:div(g('booked_min')/60,g('est_hours')),ticket:div(rev+prod,appts),
    ret:div(g('ret_any'),g('ret_eligible')),rebook:div(g('rebooked_visits'),appts),loyal:div(g('next_same'),g('next_visits')),ns:div(g('no_shows'),appts+g('no_shows')+g('cancelled')),
    uniq:g('unique_customers'),newC:g('new_customers'),comm:g('est_commission'),shopRet:g('est_shop_retained'),nsVal:g('noshow_value'),lateVal:g('late_cancel_value'),barbers:g('barbers_active'),ppv:div(prod,appts),crossLoc:div(g('next_other_loc'),g('next_visits'))};
}
// shop average weekly service revenue per barber (Sat–Fri weeks with 3+ working days)
function shopWeekAvg(loc,q){let s=0,c=0;B.forEach(b=>{if(loc!=='All'&&b.loc!==loc)return;b.w.map(WK).forEach(w=>{if(wkQ(w.i)===q&&w.days>=3){s+=w.svc;c++}})});return c?s/c:null}
// Q4 target weekly pace = Q4 rev/hr target × Q3 average estimated hours per week worked
function targetPace(b){const m=bm(b,'Q3');if(!b.tg||!m||!m.wk)return null;return b.tg[3]*m.estH/m.wk}
function status(b){return b.stat==='Active'?['Active','g']:b.stat==='Former'?['Former employee','n']:['Not on active roster','n']}
const fullName=b=>b.name;

/* ---------- weekly color scoreboard (TheBarberGuru system, Connect goals) ----------
   Red = below Quota · Green = hit Quota · Blue = hit Goal 1 · Purple = hit Goal 2, graded on weekly service revenue.
   Base: Quota $1,700 / Goal 1 $2,000 / Goal 2 $2,400 for a 44-hour week (Anthony's goals in Sharp Top Connect),
   scaled to each barber's scheduled hours and rounded to $10. */
const GBASE={h:44,q:1700,g1:2000,g2:2400};
const HRS_DEFAULT={anthonyjennings:44,carlyscott:28,sydneya:28,williamandrulot:30,haileybaranczyk:38};
const GRC={purple:['Goal 2','#a463f2'],blue:['Goal 1','#4f8ff7'],green:['Quota','#3ecf8e'],red:['Below quota','#f0706a'],part:['Partial week','#4a4844'],short:['Short week','#4a4844'],off:['Off','transparent']};
const GORDER=['purple','blue','green','red'];
function schedHrs(b){const v=S.hrs&&S.hrs[b.id];return v>0?v:(HRS_DEFAULT[b.id]||40)}
function thresholds(b){const h=schedHrs(b),r=v=>Math.round(v*h/GBASE.h/10)*10;return{h,q:r(GBASE.q),g1:r(GBASE.g1),g2:r(GBASE.g2)}}
function gradeOf(b,w){if(!w)return 'off';if(w.i===0||w.i===39)return 'part';if(w.days<3)return 'short';const t=thresholds(b);return w.svc>=t.g2?'purple':w.svc>=t.g1?'blue':w.svc>=t.q?'green':'red'}
const QWEEKS={};for(let i=0;i<40;i++){(QWEEKS[wkQ(i)]=QWEEKS[wkQ(i)]||[]).push(i)}
function scoreWeeks(b,q){const by={};b.w.forEach(w=>by[w[0]]=WK(w));return QWEEKS[q].map(i=>{const w=by[i]||null;return{i,w,g:gradeOf(b,w)}})}
function gradeCounts(b,q){const c={purple:0,blue:0,green:0,red:0,graded:0};scoreWeeks(b,q).forEach(x=>{if(c[x.g]!=null){c[x.g]++;c.graded++}});return c}
function gradeTip(b,x){return `${wkLabel(x.i)}: ${x.w?$0(x.w.svc):'no appointments'} · ${GRC[x.g][0]}${x.g==='short'?' (under 3 days)':x.g==='part'?' (partial data)':''}`}
function strip(b,q,big){return `<div class="sq ${big?'big':''}" style="grid-template-columns:repeat(${QWEEKS[q].length},1fr)">${scoreWeeks(b,q).map(x=>`<i class="g-${x.g}" title="${esc(gradeTip(b,x))}"></i>`).join('')}</div>`}
function countsH(c){return `<div class="gcount">${GORDER.map(g=>`<span><i class="g-${g}"></i>${c[g]}</span>`).join('')}</div>`}
function gradePill(g){return GRC[g]&&GORDER.includes(g)?`<span class="gp-${g}">${GRC[g][0]}</span>`:`<span class="dim small">${GRC[g]?GRC[g][0]:''}</span>`}

/* ---------- client reviews (Sharp Top Connect › Customers › Client Reviews, read Nov 14, 2026) ---------- */

document.addEventListener('click',e=>{

});

/* ---------- team rankings & grades (same composite logic as the KPI package, recomputed per quarter for active barbers) ----------
   Composite = mean percentile of revenue/hour, utilization, 60-day retention, same-barber loyalty and average ticket
   among employees with 20+ days worked in the quarter (pandas rank(pct=True) semantics). Owner and former employees excluded. */
const CORE5=['rph','util','ret','loyal','ticketPkg']; // avg ticket as defined in the KPI package: appointment-record service revenue + product sales per visit
const RKM=[['rph',1],['util',1],['ticketPkg',1],['ret',1],['loyal',1],['rebook',1],['newShare',1],['ns',0],['cancel',0],['ppv',1]];
const TS={};
function eligible(b,q){const r=b.q[q];return !!r&&b.stat!=='Former'&&b.pos!=='Owner'&&r[I.days_worked]>=20}
function median(a){const v=a.filter(x=>x!=null).sort((x,y)=>x-y);if(!v.length)return null;const h=Math.floor(v.length/2);return v.length%2?v[h]:(v[h-1]+v[h])/2}
function teamStats(q){if(TS[q])return TS[q];
  const E=B.filter(b=>eligible(b,q)).map(b=>({b,m:bm(b,q)})),n=E.length,pct={},rank={},med={},comp={},crank={},lrank={};
  RKM.forEach(([k,hib])=>{const vals=E.map(e=>val(e.m,k));const nn=vals.filter(x=>x!=null).length;med[k]=median(vals);
    E.forEach((e,i)=>{const v=vals[i];if(v==null)return;const worse=vals.filter(x=>x!=null&&(hib?x<v:x>v)).length,eq=vals.filter(x=>x===v).length,better=vals.filter(x=>x!=null&&(hib?x>v:x<v)).length;
      (pct[e.b.id]=pct[e.b.id]||{})[k]=(worse+(eq+1)/2)/nn;(rank[e.b.id]=rank[e.b.id]||{})[k]=better+1})});
  E.forEach(e=>{const p=pct[e.b.id]||{};const xs=CORE5.map(k=>p[k]).filter(x=>x!=null);comp[e.b.id]=xs.length===CORE5.length?xs.reduce((s,x)=>s+x,0)/xs.length:null});
  const ids=E.map(e=>e.b.id).filter(id=>comp[id]!=null);
  ids.forEach(id=>{crank[id]=ids.filter(o=>comp[o]>comp[id]).length+1;const loc=BY[id].loc;lrank[id]=ids.filter(o=>BY[o].loc===loc&&comp[o]>comp[id]).length+1});
  const locN={};ids.forEach(id=>{locN[BY[id].loc]=(locN[BY[id].loc]||0)+1});
  return TS[q]={n:ids.length,pct,rank,med,comp,crank,lrank,locN};
}
const OVR={A:['A','Elite','g'],B:['B','Strong','g'],C:['C','Developing','y'],D:['D','Needs improvement','r']};
function gradeOverall(b,q){const ts=teamStats(q),c=ts.comp[b.id];if(c==null)return null;const g=c>=.8?'A':c>=.6?'B':c>=.4?'C':'D';
  return{g,lab:OVR[g][1],cls:OVR[g][2],comp:c,rank:ts.crank[b.id],n:ts.n,lrank:ts.lrank[b.id],ln:ts.locN[b.loc]}}
// legacy helper used by the overview: [label, pill class]
function tier(b,q){const o=gradeOverall(b,q||'Q3');return o?[o.g+' · '+o.lab,o.cls]:null}
const CATS=[
 {k:'rev',lab:'Revenue',low:'revenue',metric:'Avg weekly sales',f:$0},
 {k:'rph',lab:'Productivity',low:'productivity',metric:'Revenue per hour',f:$2},
 {k:'util',lab:'Utilization',low:'utilization',metric:'Utilization',f:pc},
 {k:'ret',lab:'Retention',low:'retention',metric:'60-day retention',f:pc},
 {k:'loyal',lab:'Loyalty',low:'loyalty',metric:'Same-barber loyalty',f:pc},
 {k:'rebook',lab:'Rebooking',low:'rebooking',metric:'Rebooking',f:pc}];
const CATK={};CATS.forEach(c=>CATK[c.k]=c);
const GSTAT={A:['Strong','g'],B:['On track','g'],C:['Needs attention','y'],D:['Priority','r']};
const GNUM={A:4,B:3,C:2,D:1};
function catGrade(b,q,k){
  if(!eligible(b,q))return null;
  if(k==='rev'){const ws=scoreWeeks(b,q).filter(x=>GORDER.includes(x.g));if(!ws.length)return null;const avg=ws.reduce((s,x)=>s+x.w.svc,0)/ws.length,t=thresholds(b);
    const g=avg>=t.g2?'A':avg>=t.g1?'B':avg>=t.q?'C':'D';const sc=Math.min(1,avg/t.g2);
    return{g,score:sc,basis:`Avg graded week ${$0(avg)} vs weekly goals for ${t.h} hrs (Quota ${$0(t.q)} · Goal 1 ${$0(t.g1)} · Goal 2 ${$0(t.g2)})`,short:`${$0(avg)}/wk · Goal 2 ${$0(t.g2)}`}}
  const ts=teamStats(q),p=ts.pct[b.id]&&ts.pct[b.id][k];if(p==null)return null;const c=CATK[k];
  const g=p>=.75?'A':p>=.5?'B':p>=.25?'C':'D';
  return{g,score:p,basis:`#${ts.rank[b.id][k]} of ${ts.n} active barbers · team median ${c.f(ts.med[k])}`,short:`team median ${c.f(ts.med[k])}`}}
function gpill(gr,big){if(!gr)return `<span class="gl-na">—</span>`;const st=GSTAT[gr.g];return `<span class="gbadge ${st[1]}${big?' big':''}" title="${esc(gr.basis)}"><b>${gr.g}</b>${big?'':`<i>${st[0]}</i>`}</span>`}
const joinW=a=>a.length<2?a.join(''):a.slice(0,-1).join(', ')+' and '+a[a.length-1];
function catList(b,q){return CATS.map(c=>({c,gr:catGrade(b,q,c.k)})).filter(x=>x.gr)}
function summaryLine(b,q){const o=gradeOverall(b,q);if(!o)return '';const cs=catList(b,q);
  const best=cs.filter(x=>x.gr.g==='A').sort((a,b)=>b.gr.score-a.gr.score).map(x=>x.c.low);
  const weak=cs.filter(x=>x.gr.g==='D').concat(cs.filter(x=>x.gr.g==='C')).map(x=>x.c.low);
  const lead={A:'Elite overall performance',B:'Strong overall performance',C:'Developing overall',D:'Needs improvement overall'}[o.g];
  let s=lead;if(best.length)s+=` with top-tier ${joinW(best.slice(0,2))}`;if(weak.length)s+=`${best.length?'; ':', '}focus next on ${joinW(weak.slice(0,2))}`;else s+=best.length?'; keep it consistent':', with no weak spots';return s+'.'}
// change in each category's underlying metric vs the previous quarter, normalized ($: per 10%, rates: per 3 pts)
const CATMET={rev:'avgWk',rph:'rph',util:'util',ret:'ret',loyal:'loyal',rebook:'rebook'};
function catChanges(b,q){const pq=prevQ(q);if(!pq||!b.q[pq])return[];const m=bm(b,q),p=bm(b,pq);
  return CATS.map(c=>{const k=CATMET[c.k],dollars=c.f!==pc;const ch=chg(m[k],p[k],dollars?'pct':'pts');return{c,ch,norm:ch.v==null?0:ch.v/(dollars?10:3)}})}
function takeaways(b,q){const cs=catList(b,q);if(!cs.length)return null;
  const s=[...cs].sort((a,b)=>(GNUM[b.gr.g]-GNUM[a.gr.g])||(b.gr.score-a.gr.score)),strong=s[0],weak=s[s.length-1];
  const ch=catChanges(b,q).sort((a,b)=>b.norm-a.norm),imp=ch.length&&ch[0].norm>0?ch[0]:null;
  const lowOK=GNUM[weak.gr.g]>=3;let coach={kind:'cat',lab:weak.c.lab,txt:REC_CAT[weak.c.k]};
  if(lowOK){const g=b.tg?goals(b)[0]:null;if(g)coach={kind:'goal',lab:g.lab,txt:`Q4 target ${g.f(g.t)} (now ${g.f(g.c)}). ${g.rec}`}}
  return{strong,weak,imp,coach,lowOK}}
const REC_CAT={rev:'Grow weekly sales toward Goal 1: fill open slots in slow blocks, offer an add-on to existing appointments, and keep the online schedule open for every hour you’re in the shop.',
  rph:REC.rph,util:REC.util,ret:REC.ret,loyal:REC.loyal,rebook:REC.rebook};

/* ---------- barber review page ---------- */
const RV=[
 {k:'rev',lab:'Service revenue',f:$0,kind:'pct'},
 {k:'avgWk',lab:'Avg weekly sales',f:$0,kind:'pct'},
 {k:'appts',lab:'Appointments',f:n0,kind:'pct'},
 {k:'ticket',lab:'Average ticket',f:$2,kind:'pct'},
 {k:'rph',lab:'Revenue per hour',f:$2,kind:'pct',est:1},
 {k:'util',lab:'Utilization',f:pc,kind:'pts',est:1},
 {k:'ret',lab:'60-day return rate',f:pc,kind:'pts'},
 {k:'rebook',lab:'Rebooking',f:pc,kind:'pts'},
 {k:'loyal',lab:'Same-barber loyalty',f:pc,kind:'pts'}
];
const RVK={};RV.forEach(x=>RVK[x.k]=x);
// shop comparison value for a metric (per-barber where the metric is a total)
function shopVal(loc,q,k){const L=lm(loc,q);if(k==='avgWk')return shopWeekAvg(loc,q);if(k==='rev')return div(L.rev,L.barbers);if(k==='appts')return div(L.appts,L.barbers);if(k==='tips')return div(L.tips,L.barbers);return L[k]}
const shopLab=k=>(k==='rev'||k==='appts'||k==='tips')?'shop avg per barber':k==='avgWk'?'shop avg barber-week':'shop avg';
const first=b=>b.name.split(' ')[0];
function chip(c,big){if(!c||c.t==='—')return `<span class="chg flat">—</span>`;const ar=c.c==='up'?'▲':c.c==='dn'?'▼':'•';return `<span class="chg ${c.c}${big?' big':''}">${ar} ${c.t}</span>`}
const kindOf=k=>k==='ns'?'ptsInv':(['util','ret','rebook','loyal','repeat'].includes(k)?'pts':'pct');

/* strengths & opportunities from the barber's own numbers */
const INS=[['rph','Revenue per hour',$2,'$'],['ticket','Average ticket',$2,'$'],['avgWk','Avg weekly sales',$0,'$'],['util','Utilization',pc,'r'],['ret','60-day return rate',pc,'r'],['loyal','Same-barber loyalty',pc,'r'],['rebook','Rebooking',pc,'r'],['ppv','Product sales per visit',$2,'$'],['ns','No-show rate',pc,'r',1]];
function insights(b,q,noGoals){
  const m=bm(b,q),pq=prevQ(q),p=pq&&b.q[pq]?bm(b,pq):null,all=[];
  INS.forEach(([k,lab,f,t,inv])=>{const v=m[k],s=shopVal(b.loc,q,k);if(v==null||s==null||!s)return;
    let score,vsTxt;
    if(t==='$'){const r=(v-s)/s;score=(inv?-r:r)/0.08;vsTxt=Math.abs(r)<0.01?`In line with the ${b.loc} average (${f(s)})`:`${pc(Math.abs(r),0)} ${r>=0?'above':'below'} the ${b.loc} average (${f(s)})`}
    else{const d=(v-s)*100;score=(inv?-d:d)/(k==='ns'?0.6:3);vsTxt=Math.abs(d)<0.1?`In line with the ${b.loc} average (${f(s)})`:`${Math.abs(d).toFixed(1)} pts ${(d>=0)!==!!inv?'better than':'behind'} the ${b.loc} average (${f(s)})`}
    let mom=null;if(p&&p[k]!=null){const c=chg(v,p[k],t==='$'?'pct':(inv?'ptsInv':'pts'));const big=c.v!=null&&(t==='$'?Math.abs(c.v)>=8:Math.abs(c.v)>=3);if(big)mom={c,txt:`${c.c==='up'?'Improved':'Down'} ${c.t.replace(/^[+-]/,'')} from ${pq}`}}
    const tq=teamStats(q),rk_=k==='ticket'?'ticketPkg':k;const rank=tq.rank[b.id]&&tq.rank[b.id][rk_]?tq.rank[b.id][rk_]:null;

  });
  const up=x=>x.mom&&x.mom.c.c==='up';
  all.forEach(x=>{if(up(x)&&x.score<1)x.vsTxt=x.score<=-1?`Still behind the ${b.loc} average (${x.f(x.s)}), but moving the right way`:x.vsTxt});
  const strengths=all.filter(x=>x.score>=1||up(x)).sort((a,b)=>(Math.max(b.score,0)+(up(b)?1.5:0))-(Math.max(a.score,0)+(up(a)?1.5:0)));
  const opps=all.filter(x=>!up(x)&&(x.score<=-1||(x.mom&&x.mom.c.c==='dn'&&x.score<1))).sort((a,b)=>(a.score-(a.mom&&a.mom.c.c==='dn'?1:0))-(b.score-(b.mom&&b.mom.c.c==='dn'?1:0)));
  let S1=strengths.slice(0,4),O1=opps.filter(x=>!S1.includes(x)).slice(0,4);

  if(!O1.length&&!noGoals)O1=goals(b).filter(g=>g.k!=='pace').slice(0,2).map(g=>{const a=all.find(x=>x.k===g.k);return{k:g.k,lab:g.lab,f:g.f,v:g.c,vsTxt:`Already ${a&&a.score>0?'above':'near'} the ${b.loc} average. Next step: reach the Q4 target of ${g.f(g.t)}`,rank:a?a.rank:null,mom:null,soft:true}});
  if(!O1.length)O1=[...all].filter(x=>!S1.includes(x)).sort((a,b)=>a.score-b.score).slice(0,2).map(x=>Object.assign({},x,{soft:true}));
  return{strengths:S1,opps:O1,all};
}

/* three Q4 goals from the verified Q4 targets */
const GOALDEF=[['util',0,pc],['rebook',1,pc],['ret',2,pc],['rph',3,$2],['ns',4,pc],['ppv',5,$2],['loyal',6,pc]];
function goals(b){
  const m=bm(b,'Q3');if(!b.tg||!m)return[];
  const ins=insights(b,'Q3',true),sc={};ins.all.forEach(x=>sc[x.k]=x.score);
  const lab={util:'Utilization',rebook:'Rebooking at checkout',ret:'60-day return rate',rph:'Revenue per hour',ns:'No-show rate',ppv:'Product sales per visit',loyal:'Same-barber loyalty'};
  const wk=m.wk||13;
  const cands=GOALDEF.map(([k,i,f])=>{const t=b.tg[i],c=val(m,k);const inv=k==='ns';const met=inv?c<=t:c>=t;const gap=inv?(c-t)/(c||1):(t-c)/(t||1);return{k,lab:lab[k],f,t,c,met,inv,gap,score:sc[k]??0}}).filter(x=>x.c!=null&&!x.met&&x.gap>0.005);
  cands.sort((a,b)=>(a.score-b.score)||(b.gap-a.gap));
  const out=cands.slice(0,3);
  const tp=targetPace(b);if(out.length<3&&tp&&m.avgWk&&tp>m.avgWk)out.push({k:'pace',lab:'Weekly service revenue',f:$0,t:tp,c:m.avgWk,inv:false});
  out.forEach(g=>{const d=g.inv?g.c-g.t:g.t-g.c;
    g.how={util:`About ${n1(d*m.estH/wk)} more booked hours a week at your Q3 schedule.`,
      rebook:`About ${Math.max(1,Math.ceil(d*m.appts/wk))} more clients a week leaving with their next appointment booked.`,
      ret:`About ${Math.max(1,Math.ceil(d*m.retElig))} more clients coming back within 60 days over the quarter.`,
      rph:`${$2(d)} more for every hour in the chair, about ${$0(d*m.estH/wk)} more a week at Q3 hours.`,
      ns:`About ${Math.max(1,Math.ceil(d*(m.appts+m.nsN+m.cancelN)))} fewer no-shows over the quarter.`,
      ppv:`About ${$0(d*m.appts/wk)} more in product sales a week.`,
      loyal:`About ${Math.max(1,Math.ceil(d*m.nextN))} more return visits staying in your chair over the quarter.`,
      pace:`${$0(d)} more per week at the same hours, from the revenue-per-hour target.`}[g.k];
    g.rec=g.k==='pace'?REC.rph:REC[g.k];
    g.prog=g.inv?Math.min(1,g.t/g.c):Math.min(1,g.c/g.t);
  });
  return out;
}

  if(ni<0||gi<0)throw new Error('Payroll register needs an employee name column and a gross wages column');

/* ---------- Profitability performance score (0–100) ----------
   Fixed targets calibrated to Sharp Top's Jan–Sep 2026 operations (not relative to other barbers).
   Each measure scores 0 at its floor, 60 at the minimum acceptable level and 100 at target (capped).
   Everything is per scheduled hour over the weeks a barber was actually employed, so part-time chairs aren't penalized for fewer hours. */
const PTGT={
 cph:{lab:'Profitability',sub:'Contribution per scheduled hour',floor:0,min:8,tgt:22,w:.40,f:sgn$2},
 rph:{lab:'Productivity',sub:'Service revenue per scheduled hour',floor:15,min:30,tgt:55,w:.25,f:$2},
 util:{lab:'Chair utilization',sub:'Booked hours ÷ scheduled hours',floor:.25,min:.50,tgt:.80,w:.20,f:v=>pc(v,0)},
 lab:{lab:'Labor cost efficiency',sub:'Employment cost ÷ service revenue (lower is better)',floor:.90,min:.70,tgt:.55,w:.15,f:v=>pc(v,0),inv:true}};
const PK=Object.keys(PTGT);

  if(x>=tg)return 100;if(x>=mn)return 60+40*(x-mn)/(tg-mn);if(x<=fl)return 0;return 60*(x-fl)/(mn-fl)}
const letter=s=>s==null?null:s>=90?'A':s>=80?'B':s>=70?'C':s>=60?'D':'F';
const LCLS={A:'g',B:'g',C:'y',D:'y',F:'r'};
// components from a calculated period (pCalc / window)
function pComps(x){const hrs=x.weeks*x.sh,emp=x.wages+x.tax+(x.unemp||0)+(x.other||0);
  return{cph:hrs?x.contrib/hrs:null,rph:hrs?x.rev/hrs:null,util:x.util,lab:x.rev?emp/x.rev:null}}
function pScore(x){const c=pComps(x),s={};let tot=0,w=0;const miss=[];PK.forEach(k=>{s[k]=subScore(c[k],PTGT[k]);if(s[k]==null)miss.push(PTGT[k].lab);else{tot+=s[k]*PTGT[k].w;w+=PTGT[k].w}});
  return{c,s,score:w?tot/w:null,miss}}
// what's needed before a grade can be final
function pFinal(x,P){const why=[];const reg=pReg(P),rr=reg&&reg.rows[x.b.id];
  if(!reg)why.push('No payroll register for this period (hourly guarantees, bonuses and paid leave can’t be included)');

  else{if(rr.tax==null)why.push('Payroll register has no employer-tax column');if(!rr.tipsOk)why.push('Can’t confirm the register’s gross pay excludes tips')}
  if(!(rr&&rr.other!=null)&&S.pset.other==null)why.push('Other employment costs not entered');
  if(x.util==null)why.push('No booked-hours data for chair utilization');
  return why}
function pEval(b,P){const x=pCalc(b,P);if(!x)return null;const sc=pScore(x);const why=pFinal(x,P);sc.miss.forEach(m=>why.push(m+' couldn’t be measured'));

// rolling 4-/12-week windows (built-in period only: weekly appointment revenue × SQUIRE rate — always provisional)
const LASTFULL=38;
function pWindow(b,P,from,to){const p=P.pay&&P.pay[b.id];if(!p)return null;const rate=p[1]/100;
  const startWk=b.start?Math.max(0,Math.floor((dISO(b.start)-new Date(2025,11,27))/6048e5)):0;
  if(startWk>from)return null; // only compare windows the barber worked in full
  const idx=[];for(let i=from;i<=to;i++)idx.push(i);
  const by={};b.w.forEach(w=>by[w[0]]=WK(w));let rev=0,tips=0,bh=0;idx.forEach(i=>{const w=by[i];if(w){rev+=w.svc;tips+=w.tip;bh+=w.bh||0}});
  if(!rev)return null;const weeks=idx.length,sh=schedHrs(b),wages=rev*rate,tax=S.pset.fica/100*(wages+(S.pset.ficaTips?tips:0));
  const unemp=S.pset.unemp!=null?S.pset.unemp*weeks/52:null,other=S.pset.other!=null?S.pset.other*weeks/(52/12):null;
  const x={b,rev,wages,tips,tax,unemp,other,weeks,sh,util:bh/(weeks*sh)};x.contrib=rev-wages-tax-(unemp||0)-(other||0);return pScore(x).score}

function pEvalAll(){const P=pPeriod();if(!P)return{P:null,co:[],other:[]};
  const all=D.barbers.map(b=>{const e=pEval(b,P);if(!e)return null;e.why0=pRank(b);e.t4=pTrend(b,P,4);e.t12=pTrend(b,P,12);return e}).filter(Boolean);
  const co=all.filter(e=>!e.why0&&e.score!=null).sort((a,b)=>b.score-a.score);co.forEach((e,i)=>{e.rank=i+1;const lo=co.filter(z=>z.b.loc===e.b.loc);e.lrank=lo.indexOf(e)+1;e.ln=lo.length});

function trendH(t){if(!t)return '<span class="dim">—</span>';const d=t.d;return `<span class="ptr"><b>${Math.round(t.now)}</b>${d==null?'':`<i class="${Math.abs(d)<1?'flat':d>0?'up':'dn'}">${Math.abs(d)<1?'•':d>0?'▲':'▼'}${Math.abs(d).toFixed(0)}</i>`}</span>`}

function pTargetsH(){return `<div class="note" style="font-size:13px;line-height:1.6"><p>The score combines four measures, each against a <b>fixed target</b> set from Sharp Top’s Jan–Sep 2026 operations, so a barber’s grade doesn’t move just because a teammate had a good or bad quarter. Everything is measured per <b>scheduled hour</b> over the weeks the barber was actually employed, which keeps part-time chairs and mid-year hires on equal footing.</p></div>

function parseRegister(text){const rows=parseCSV(text).filter(r=>r.some(x=>x&&x.trim()));const H=rows[0].map(x=>x.toLowerCase().trim());
  const f=re=>H.findIndex(h=>re.test(h));
  const ci={name:f(/employee|name/),gross:f(/gross/),hourly:f(/hourly|regular|guarantee|minimum/),comm:f(/commission/),bonus:f(/bonus/),leave:f(/pto|paid leave|vacation|sick|holiday/),tips:f(/tip/),
    tax:f(/employer.*tax|er tax|company tax|employer liabilit/),other:f(/employer.*(benefit|contribution|other)|workers.?comp/)};
  if(ci.name<0)throw new Error('Payroll register needs an employee name column');
  const comps=['hourly','comm','bonus','leave'].filter(k=>ci[k]>=0);
  if(ci.gross<0&&!comps.length)throw new Error('Payroll register needs gross pay, or pay columns (hourly/guarantee, commission, bonus, paid leave)');
  const out={},un=[];rows.slice(1).forEach(r=>{const id=pMatchId(r[ci.name]);if(!id){if(r[ci.name]&&!/total/i.test(r[ci.name]))un.push(r[ci.name]);return}
    const o=out[id]||{gross:0,tax:ci.tax<0?null:0,other:ci.other<0?null:0,tips:0,parts:{}};const n=k=>ci[k]>=0?(num(r[ci[k]])||0):0;
    let pay;if(comps.length&&ci.gross<0){pay=comps.reduce((s,k)=>s+n(k),0)}else{pay=n('gross')-(ci.tips>=0?n('tips'):0)}
    o.gross+=pay;o.tips+=n('tips');comps.forEach(k=>o.parts[k]=(o.parts[k]||0)+n(k));if(ci.tax>=0)o.tax+=n('tax');if(ci.other>=0)o.other+=n('other');
    o.tipsOk=ci.tips>=0||(comps.length>0&&ci.gross<0);out[id]=o});
  return{rows:out,unmatched:un,hasTax:ci.tax>=0,tipsOk:ci.tips>=0||(comps.length>0&&ci.gross<0)}}
function pReg(P){if(!P)return null;const ks=Object.keys(S.pregs).filter(k=>k===P.start+'_'+P.end||k.startsWith(P.start+'_'+P.end+'_')).sort();return ks.length?S.pregs[ks[ks.length-1]]:null}
// imports never overwrite: every import is stored under its own timestamped key
async function pDoImport(){const msg=document.getElementById('piMsg');const st=document.getElementById('piStart').value,en=document.getElementById('piEnd').value;
  const pf=[...document.getElementById('piPay').files],rf=document.getElementById('piReg').files[0];
  let s=st,e=en;const m=(pf[0]&&pf[0].name.match(/(\d{4}-\d{2}-\d{2})_(\d{4}-\d{2}-\d{2})/));if((!s||!e)&&m){s=s||m[1];e=e||m[2]}
  if(!s||!e){msg.textContent='Enter the period start and end dates (they must match the reports).';return}
  if(e<s){msg.textContent='End date is before start date.';return}
  if(!pf.length&&!rf){msg.textContent='Choose at least one file.';return}
  const ts=Date.now(),label=`${dISO(s).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})} – ${dISO(e).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})}`;const notes=[];
  try{if(pf.length){const pay={};let un=[];for(const f of pf){const r=parsePayout(await f.text());Object.assign(pay,r.pay);un=un.concat(r.unmatched)}
      const key='p_'+s+'_'+e+'_'+ts;const rec={start:s,end:e,label,source:'Imported SQUIRE payout reports',pay,imported:new Date(ts).toISOString()};S.pimports[key]=rec;S.pperiod=key;if(S.db)await S.db.doc('profit/'+key).set(rec);
      notes.push(`Saved as a new period (earlier periods kept): ${Object.keys(pay).length} barbers${un.length?`; not matched: ${un.join(', ')}`:''}.`)}
    if(rf){const r=parseRegister(await rf.text());const k=s+'_'+e+'_'+ts;const rec={start:s,end:e,rows:r.rows,imported:new Date(ts).toISOString()};S.pregs[k]=rec;if(S.db)await S.db.doc('profit/r_'+k).set(rec);
      const hasP=Object.values(pPeriods()).some(p=>p.start===s&&p.end===e);notes.push(`Payroll register saved: ${Object.keys(r.rows).length} barbers${r.unmatched.length?`, not matched: ${r.unmatched.join(', ')}`:''}${r.hasTax?'':'; no employer-tax column, so grades stay provisional'}${r.tipsOk?'':'; no tips column, so it can’t be confirmed that gross pay excludes tips'}${hasP?'':'; no SQUIRE payout report for this exact period yet, so it isn’t applied'}.`)}
    S.pimp=false;S.keepScroll=true;render();toast(notes.join(' '),7000)}
  catch(err){msg.textContent='Import failed: '+(err.message||err)}}

/* ---------- boot ---------- */
fromHash();render();initCaps();
</script>
